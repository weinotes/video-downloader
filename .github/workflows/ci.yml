name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 ruff
          pip install -e .

      - name: Lint with flake8
        run: |
          flake8 video_downloader.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 video_downloader.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint with ruff
        run: |
          ruff check video_downloader.py

      - name: Check imports
        run: |
          python -c "import video_downloader" 2>/dev/null && echo "Import OK" || echo "Import failed (expected if script not designed as module)"
